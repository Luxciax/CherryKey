name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CherryKey.sln

      - name: Publish stable portable build
        shell: pwsh
        run: |
          dotnet publish src/CherryKey/CherryKey.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/CherryKey-portable

          $process = Start-Process `
            -FilePath "artifacts/CherryKey-portable/CherryKey.exe" `
            -ArgumentList "--smoke-test", "--no-tray" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) { throw "Startup smoke test failed." }

          Compress-Archive -Path artifacts/CherryKey-portable/* -DestinationPath artifacts/CherryKey-portable-win-x64.zip -Force

      - name: Publish single-file build
        shell: pwsh
        run: |
          dotnet publish src/CherryKey/CherryKey.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/CherryKey-single-file

          Compress-Archive -Path artifacts/CherryKey-single-file/* -DestinationPath artifacts/CherryKey-single-file-win-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/CherryKey-portable-win-x64.zip
            artifacts/CherryKey-single-file-win-x64.zip
          generate_release_notes: true
