name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CherryKey.sln

      - name: Build
        run: dotnet build CherryKey.sln -c Release --no-restore

      - name: Publish portable win-x64
        shell: pwsh
        run: |
          dotnet publish src/CherryKey/CherryKey.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/portable

      - name: Startup smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "artifacts/portable/CherryKey.exe"
          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList "--smoke-test", "--no-tray" `
            -PassThru

          if (-not $process.WaitForExit(20000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "CherryKey smoke test timed out."
          }

          $log = Join-Path $env:LOCALAPPDATA "CherryKey/Logs/startup.log"
          if (Test-Path $log) {
            Write-Host "----- startup.log -----"
            Get-Content $log
            Write-Host "-----------------------"
          }

          if ($process.ExitCode -ne 0) {
            throw "CherryKey smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Publish single-file win-x64
        shell: pwsh
        run: |
          dotnet publish src/CherryKey/CherryKey.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/single-file

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/portable/* `
            -DestinationPath artifacts/CherryKey-portable-win-x64.zip `
            -Force

          Compress-Archive `
            -Path artifacts/single-file/* `
            -DestinationPath artifacts/CherryKey-single-file-win-x64.zip `
            -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CherryKey-win-x64
          path: |
            artifacts/CherryKey-portable-win-x64.zip
            artifacts/CherryKey-single-file-win-x64.zip
          if-no-files-found: error
          retention-days: 30
